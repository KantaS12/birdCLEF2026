# Default data config (config A mel-spectrogram).
data:
  train_h5: data/cache/all_config_a.h5
  val_h5:   data/cache/all_config_a.h5
  fold_csv: null
  num_workers: 4
  batch_size: 32
  pin_memory: true
  use_sampler: true

mel:
  n_mels: 128
  n_fft: 1024
  hop_length: 320
  fmin: 50.0
  fmax: 14000.0
  sample_rate: 32000

training:
  min_lr: 1.0e-6
  early_stopping_patience: 5
